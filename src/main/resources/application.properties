# =============================================================================
# application.properties - portalCnab
#
# ATENCAO: Este arquivo vai para o Git.
# Valores sensiveis (senhas, secrets) vem de variaveis de ambiente.
# Configure-as no .env (local) ou no painel do Render (producao).
# =============================================================================

# -- Aplicacao -----------------------------------------------------------------
spring.application.name=cnabportal

# -- Datasource (PostgreSQL) --------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# -- JPA / Hibernate ----------------------------------------------------------
# validate: Hibernate valida o schema - Flyway e quem cria/altera as tabelas
# Nunca use create ou create-drop em producao
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -- Flyway (migrations) ------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# -- JWT ----------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# -- Spring Security ----------------------------------------------------------
# Desativa o formulario de login padrao do Spring Security
spring.security.user.name=disabled
spring.security.user.password=disabled

# -- Spring Data Web ----------------------------------------------------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.one-indexed-parameters=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -- Logs ---------------------------------------------------------------------
# IMPORTANTE: nunca logue senhas ou tokens JWT
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.com.pedrocampelo=DEBUG

# -- CORS ---------------------------------------------------------------------
# Origens permitidas para o frontend React
# Em producao, adicione o dominio real do Render
app.cors.allowed-origins=http://localhost:5173,https://whallet.com.br,https://www.whallet.com.br,https://portalcnab-frontend.onrender.com

# -- Email (Resend) -----------------------------------------------------------
resend.api-key=${RESEND_API_KEY}
email.from=${EMAIL_FROM:noreply@whallet.com.br}

# -- URL da aplicacao (usada nos links dos emails) ----------------------------
app.url=${APP_URL:http://localhost:5173}