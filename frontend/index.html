  <!-- ── Schema.org — FAQPage ──────────────────────────────────────────── -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é o Whallet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Whallet é um ERP simples e acessível para pequenas empresas, MEIs e autônomos. Reúne gestão comercial (orçamentos, pedidos de venda, cargas e roteirização de entregas), controle financeiro (recebimentos, contas a pagar, fluxo de caixa) e relatórios com inteligência artificial — tudo em um sistema online, sem instalação e sem complexidade."
          }
        },
        {
          "@type": "Question",
          "name": "O Whallet é um ERP? Para que tipo de empresa serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Whallet funciona como um ERP acessível pensado para pequenas empresas, MEIs e autônomos que precisam organizar processos comerciais e financeiros sem pagar caro por sistemas complexos. É ideal para quem emite orçamentos, controla pedidos, faz entregas e precisa ter o financeiro em dia — tudo integrado."
          }
        },
        {
          "@type": "Question",
          "name": "Quais módulos o Whallet oferece?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Whallet oferece: Módulo Comercial (orçamentos, pedidos de venda, gestão de cargas e roteirização de entregas), Módulo Financeiro (contas a receber, contas a pagar, fluxo de caixa, categorias e centros de custo), Relatórios com IA, e ferramentas de CNAB para conversão e validação de arquivos bancários."
          }
        },
        {
          "@type": "Question",
          "name": "O Whallet ajuda a gerenciar entregas e roteirização?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O módulo de Cargas permite agrupar pedidos de venda em uma carga, informar os endereços de entrega e exportar um JSON de roteirização compatível com ferramentas de otimização de rotas. Isso facilita o planejamento logístico sem precisar de sistemas externos caros."
          }
        },
        {
          "@type": "Question",
          "name": "O Whallet converte arquivos CNAB?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Whallet converte arquivos CNAB 240 e CNAB 400 para planilhas Excel (.xlsx) e PDF, com suporte aos principais bancos do mercado. É possível usar a ferramenta gratuitamente, sem instalação."
          }
        },
        {
          "@type": "Question",
          "name": "O Whallet tem plano gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O plano gratuito inclui validação de arquivos CNAB, acesso de leitura aos módulos e consultas ao assistente de IA. Para criar e gerenciar orçamentos, pedidos, financeiro e entregas, o plano Whallet+ custa R$ 39,90/mês com 7 dias de teste grátis, sem cartão de crédito."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso instalar alguma coisa para usar o Whallet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O Whallet é 100% online. Basta acessar pelo navegador de qualquer dispositivo — computador, tablet ou celular. Não há instalação, servidores para configurar ou manutenção técnica da sua parte."
          }
        }
      ]
    }
  </script>
