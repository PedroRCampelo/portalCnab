# =============================================================================
# application.properties - portalCnab
#
# ATENCAO: Este arquivo vai para o Git.
# Valores sensiveis (senhas, secrets) vem de variaveis de ambiente.
# Configure-as no .env (local) ou no painel do Render (producao).
# =============================================================================

# -- Aplicacao -----------------------------------------------------------------
spring.application.name=cnabportal

# -- Datasource (PostgreSQL) --------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# -- JPA / Hibernate ----------------------------------------------------------
# validate: Hibernate valida o schema - Flyway e quem cria/altera as tabelas
# Nunca use create ou create-drop em producao
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -- Flyway (migrations) ------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# -- JWT ----------------------------------------------------------------------
jwt.secret=${JWT_SECRET:whallet-dev-secret-local-apenas-nao-usar-em-producao-512bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# -- Spring Security ----------------------------------------------------------
# Desativa o formulario de login padrao do Spring Security
spring.security.user.name=disabled
spring.security.user.password=disabled

# -- Spring Data Web ----------------------------------------------------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.one-indexed-parameters=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# -- Logs ---------------------------------------------------------------------
# IMPORTANTE: nunca logue senhas ou tokens JWT
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.com.pedrocampelo=DEBUG

# -- CORS ---------------------------------------------------------------------
# Origens permitidas para o frontend React
# Em producao, adicione o dominio real do Render
app.cors.allowed-origins=http://localhost:5173,https://whallet.com.br,https://www.whallet.com.br,https://portalcnab-frontend.onrender.com

# -- Email (Resend) -----------------------------------------------------------
resend.api-key=${RESEND_API_KEY}
email.from=${EMAIL_FROM:noreply@whallet.com.br}

# -- URL da aplicacao (usada nos links dos emails) ----------------------------
app.url=${APP_URL:http://localhost:5173}
# -- Stripe -------------------------------------------------------------------
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.price-id-pro=${STRIPE_PRICE_ID_PRO}
stripe.price-id-whallet-plus=${STRIPE_PRICE_ID_WHALLET_PLUS:}

# -- OpenAI (insights financeiros) -------------------------------------------
openai.api-key=${OPENAI_API_KEY:}

# -- CNAB AI (agente de conhecimento) -----------------------------------------
cnab.ai.max-context-chars=32000
cnab.ai.min-similarity=0.30
cnab.ai.top-k=20
openai.chat.model=gpt-4o
openai.embedding.model=text-embedding-3-small

# -- Google OAuth (login social) ----------------------------------------------
# Client ID publico ? vem da var de ambiente (mesmo do frontend)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# -- WhatsApp Evolution API (bot) ---------------------------------------------
whatsapp.evolution.url=${EVOLUTION_API_URL:http://157.245.90.220:8080}
